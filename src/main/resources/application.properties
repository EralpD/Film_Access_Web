spring.config.import=optional:file:.env[.properties]
#debug=true
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/film_archive}
spring.datasource.username=${POSTGRES_USER:filmApp}
spring.datasource.password=${POSTGRES_PASSWORD:filmapp2026**}

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.omdb.base-url=https://www.omdbapi.com/
app.omdb.api-key=${OMDB_API_KEY}

app.omdb.connect-timeout=2s
app.omdb.read-timeout=5s

server.servlet.session.timeout=30m

# OpenAI yalnızca mevcut film/query embedding'leri için kalır.
spring.ai.model.embedding=openai
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.embedding.options.dimensions=1536

# Gemini yalnızca buddy'nin doğal dil yorumlaması için kullanılır.
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.max-output-tokens=900
spring.ai.google.genai.chat.google-search-retrieval=false

buddy.recommendations.display-limit=6
buddy.recommendations.candidate-limit=48
buddy.recommendations.max-per-primary-genre=2
buddy.recommendations.min-similarity=0.28

app.semantic.backfill-on-startup=${SEMANTIC_BACKFILL_ON_STARTUP:false}
app.semantic.embedding-batch-size=${SEMANTIC_EMBEDDING_BATCH_SIZE:64}
app.catalog.detail-cache-ttl=${CATALOG_DETAIL_CACHE_TTL:30d}
# Yalnızca mevcut katalog verisini bir defa yenilerken true yap.
app.catalog.refresh-on-startup=${CATALOG_REFRESH_ON_STARTUP:false}

home.recommendations.display-limit=6
home.recommendations.candidate-limit=48
home.recommendations.max-per-primary-genre=2
home.recommendations.min-similarity=0.25

# Catalog uses archive-based similarity after this many indexed films; otherwise it shows a stable daily shuffle.
catalog.personalization.min-profile-films=${CATALOG_PERSONALIZATION_MIN_PROFILE_FILMS:3}


# Uygulama başlangıcında değil, Mio boş sonuç yanıtını gönderdikten sonra tetiklenir.
app.catalog.bootstrap.enabled=${CATALOG_BOOTSTRAP_ENABLED:true}
app.catalog.bootstrap.dataset-path=${CATALOG_BOOTSTRAP_DATASET_PATH:film-data/title.basics.tsv.gz}
# Popülerlik: IMDb oy sayısı azalan; eşitlikte IMDb puanı azalan.
# HTTPS kaynağı her bootstrap çalışmasında okunur; yerel .tsv.gz yolu da verilebilir.
app.catalog.bootstrap.ratings-path=${CATALOG_BOOTSTRAP_RATINGS_PATH:https://datasets.imdbws.com/title.ratings.tsv.gz}
app.catalog.bootstrap.max-films=${CATALOG_BOOTSTRAP_MAX_FILMS:50}
app.catalog.bootstrap.request-delay=${CATALOG_BOOTSTRAP_REQUEST_DELAY:250ms}
app.catalog.bootstrap.max-consecutive-failures=${CATALOG_BOOTSTRAP_MAX_CONSECUTIVE_FAILURES:20}


# Archive hybrid search: thresholds are independent and should be calibrated on real queries.
archive.semantic.min-similarity=0.35
archive.search.fuzzy-threshold=0.35
archive.search.embedding-timeout-ms=4000
archive.search.cache-ttl-ms=900000
archive.search.cache-size=512
# Optional second-level cache; the in-process cache remains active when disabled or unavailable.
archive.search.redis-enabled=${REDIS_QUERY_CACHE_ENABLED:false}
spring.data.redis.url=${REDIS_URL:redis://127.0.0.1:6380}
# Includes first-connection handshake; overly short limits can bypass a healthy cache on cold startup.
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false
spring.data.redis.lettuce.pool.enabled=false
archive.search.spelling-candidates=${ARCHIVE_SEARCH_SPELLING_CANDIDATES:200}
app.catalog.metadata-refresh-enabled=${CATALOG_METADATA_REFRESH_ENABLED:true}
app.catalog.metadata-refresh-batch-size=4
app.catalog.metadata-refresh-initial-delay-ms=60000
app.catalog.metadata-refresh-delay-ms=60000
# Repair saved films only; never import catalog titles from an archive search.
archive.search.repair-enabled=${ARCHIVE_SEARCH_REPAIR_ENABLED:true}
archive.search.repair-batch-size=16
archive.search.repair-initial-delay-ms=60000
archive.search.repair-delay-ms=60000
