<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link th:href="@{/css/app.css}" rel="stylesheet">

    <th:block th:replace="~{fragments/theme :: themeHead}">
</th:block>
</head>
<body class="app-page page--auth page--register">

<div class="theme-toggle-dock">

    <th:block th:replace="~{fragments/theme :: themeToggle}">
    </th:block>

</div>

    <main>
        <h1>Register</h1>

        <p class="subtitle">
            Create an account to start your personal film collection.
        </p>

        <form
            th:action="@{/register}"
            th:object="${registrationRequest}"
            method="post"
        >

            <div>
                <label for="displayName">Name</label>

                <input
                    id="displayName"
                    type="text"
                    autocomplete="name"
                    th:field="*{displayName}"
                    placeholder="Enter your name"
                >

                <p
                    role="alert"
                    th:if="${#fields.hasErrors('displayName')}"
                    th:errors="*{displayName}"
                ></p>
            </div>

            <div>
                <label for="email">E-mail</label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    th:field="*{email}"
                    placeholder="example@email.com"
                >

                <p
                    role="alert"
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}"
                ></p>
            </div>

            <div>
                <label for="password">Password</label>

                <input
                    id="password"
                    type="password"
                    autocomplete="new-password"
                    th:field="*{password}"
                    placeholder="Enter your password"
                >

                <p
                    role="alert"
                    th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}"
                ></p>
            </div>

            <div>
                <label for="passwordConfirmation">
                    Password Confirmation
                </label>

                <input
                    id="passwordConfirmation"
                    type="password"
                    autocomplete="new-password"
                    th:field="*{passwordConfirmation}"
                    placeholder="Enter your password again"
                >

                <p
                    role="alert"
                    th:if="${#fields.hasErrors('passwordConfirmation')}"
                    th:errors="*{passwordConfirmation}"
                ></p>
            </div>

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a th:href="@{/login}">Log In</a>
        </p>
    </main>

</body>
</html>
