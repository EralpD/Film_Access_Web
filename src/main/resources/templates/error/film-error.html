<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Film Information Unavailable - Film Archive
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f5f7;

            color: #222;
        }

        .page-container {
            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 24px;
        }

        .error-card {
            width: 100%;
            max-width: 540px;

            background: #fff;

            padding: 40px 32px;

            border-radius: 12px;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .error-icon {
            font-size: 52px;
            margin-bottom: 12px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 14px;
        }

        .error-message {
            margin: 0 auto 28px;

            max-width: 430px;

            color: #555;

            line-height: 1.6;
        }

        .hint {
            margin-bottom: 26px;

            color: #777;

            font-size: 14px;
        }

        .actions {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }

        .button {
            display: inline-block;

            padding: 11px 17px;

            border-radius: 6px;

            text-decoration: none;

            font-weight: 600;
        }

        .button-primary {
            background: #222;
            color: #fff;
        }

        .button-secondary {
            background: #ededed;
            color: #222;
        }

    </style>

    <link th:href="@{/css/app.css}" rel="stylesheet">

    <th:block th:replace="~{fragments/theme :: themeHead}">
</th:block>

</head>


<body class="app-page page--error">

<div class="theme-toggle-dock">

    <th:block th:replace="~{fragments/theme :: themeToggle}">
    </th:block>

</div>

<div class="page-container">

    <main class="error-card">

        <div class="error-icon"
             aria-hidden="true">
            🎬
        </div>


        <h1>
            Film information is unavailable.
        </h1>


        <!--
            GlobalExceptionHandler tarafından sağlanan
            kullanıcı dostu hata mesajı.
        -->
        <p class="error-message"
           th:text="${errorMessage != null}
                   ? ${errorMessage}
                   : 'An unexpected error occurred while retrieving the film information.'">

            An unexpected error occurred while retrieving the film information.

        </p>


        <p class="hint">
            Return to Discover to try a different result or repeat the request.
        </p>


        <div class="actions">

            <a class="button button-primary"
               th:href="@{/search}">

                Return to Discover

            </a>


            <a class="button button-secondary"
               th:href="@{/archive}">

                Return to My Archive

            </a>

        </div>

    </main>

</div>

</body>

</html>
