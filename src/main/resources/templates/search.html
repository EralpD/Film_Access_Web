<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <link th:href="@{/css/search.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">

    <title>Film Search - Film Archive</title>

</head>

<body class="app-page page--search">

<header>

    <nav class="navbar"
         aria-label="Primary navigation">

        <h1>Film Archive</h1>

        <div class="nav-actions">

            <a class="nav-link"
               th:href="@{/archive}">
                My Archive
            </a>

            <form th:action="@{/logout}"
                  method="post">

                <button class="logout-button"
                        type="submit">
                    Logout
                </button>

            </form>

        </div>

    </nav>

</header>

<main>

    <section class="search-panel">

        <h2>Film Search</h2>

        <form class="search-form"
              th:action="@{/search}"
              method="get">

            <div class="form-group">

                <label for="query">
                    Title
                </label>

                <input
                    id="query"
                    name="query"
                    type="text"
                    th:value="${query}"
                    minlength="2"
                    required
                    placeholder="e.g. Inception"
                >

            </div>

            <div class="form-group">

                <label for="year">
                    Year
                </label>

                <input
                    id="year"
                    name="year"
                    type="number"
                    min="1888"
                    max="2100"
                    th:value="${year}"
                    placeholder="2010"
                >

            </div>

            <div class="form-group">

                <label for="type">
                    Type
                </label>

                <select id="type"
                        name="type">

                    <option value="">
                        All
                    </option>

                    <option value="movie"
                            th:selected="${type == 'movie'}">
                        Movie
                    </option>

                    <option value="series"
                            th:selected="${type == 'series'}">
                        Series
                    </option>

                    <option value="episode"
                            th:selected="${type == 'episode'}">
                        Episode
                    </option>

                </select>

            </div>

            <button class="search-button"
                    type="submit">
                Search
            </button>

        </form>

    </section>


    <!--
        Arama henüz yapılmadıysa sonuç bölümü
        gösterilmez.
    -->

    <section th:if="${query != null and !query.isBlank()}">

        <h2 class="results-title">
            Search Results
        </h2>


        <!-- No results -->
        <div class="empty-state"
             role="status"
             th:if="${results == null or #lists.isEmpty(results)}">

            No results found for your search.

        </div>


        <!-- Sonuçlar -->
        <div class="film-grid"
             th:if="${results != null and !#lists.isEmpty(results)}">

            <article class="film-card"
                     th:each="film : ${results}">

                <div class="poster-wrapper">

                    <img
                        th:if="${film.poster != null
                                and film.poster != 'N/A'}"
                        th:src="${film.poster}"
                        th:alt="${film.title}"
                    >

                    <div class="poster-placeholder"
                         th:if="${film.poster == null
                                or film.poster == 'N/A'}">

                        Poster not available

                    </div>

                </div>

                <div class="film-content">

                    <h3 class="film-title"
                        th:text="${film.title}">
                        Film Title
                    </h3>

                    <p class="film-meta"
                       th:if="${film.year != null}">

                        <strong>Year:</strong>

                        <span th:text="${film.year}">
                            2010
                        </span>

                    </p>

                    <p class="film-meta"
                       th:if="${film.type != null}">

                        <strong>Type:</strong>

                        <span th:text="${film.type}">
                            movie
                        </span>

                    </p>

                    <!--
                        Arama sonucundan yalnızca IMDb ID
                        ayrıntı endpoint'ine taşınır.
                    -->
                    <a class="detail-link"
                       th:href="@{/search/{id}
                           (id=${film.imdbId})}">

                        View Details

                    </a>

                </div>

            </article>

        </div>


        <!-- Pagination -->
        <nav class="pagination"
             aria-label="Search result pages"
             th:if="${totalPages != null
                     and totalPages > 1}">

            <!-- Önceki -->
            <a class="page-link"
               th:classappend="${currentPage <= 1}
                    ? ' disabled' : ''"

               th:href="@{/search(
                    query=${query},
                    year=${year},
                    type=${type},
                    page=${currentPage - 1}
               )}">

                Previous

            </a>


            <!-- Sayfa numaraları -->
            <a class="page-link"
               th:each="pageNumber :
                    ${#numbers.sequence(1, totalPages)}"

               th:text="${pageNumber}"

               th:classappend="${pageNumber == currentPage}
                    ? ' current' : ''"

               th:href="@{/search(
                    query=${query},
                    year=${year},
                    type=${type},
                    page=${pageNumber}
               )}">

                1

            </a>


            <!-- Sonraki -->
            <a class="page-link"
               th:classappend="${currentPage >= totalPages}
                    ? ' disabled' : ''"

               th:href="@{/search(
                    query=${query},
                    year=${year},
                    type=${type},
                    page=${currentPage + 1}
               )}">

                Next

            </a>

        </nav>

    </section>

</main>

</body>
</html>
